<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea2App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- 侧栏:Chat(全局) + Projects 列表 -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="logo">✦</div>
      <button class="s-entry" id="chatEntry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chat</span>
        <span class="s-sub">随便聊</span>
      </button>
    </div>

    <div class="s-sec">项目</div>
    <div class="projects" id="projectsWrap">
      <div class="p-group">进行中</div>
      <div id="projActive"></div>
      <div class="p-group">已完成</div>
      <div id="projDone"></div>
    </div>
    <button class="s-new" id="newProjectBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>新建项目</span>
    </button>

    <div class="s-grow"></div>
    <button class="s-entry" id="apiBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>API 配置</span>
    </button>
    <button class="s-entry" id="toggleTheme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>主题</span>
    </button>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="header" id="header"></header>
    <div class="tabs" id="tabs" hidden>
      <button data-view="chat" class="active">对话</button>
      <button data-view="prd">PRD</button>
      <button data-view="spec">SPEC</button>
    </div>
    <div class="content">
      <section class="view active" id="view-chat">
        <div class="buildbar" id="buildbar" hidden>
          <div><b>SPEC 已冻结</b><span>进入自驱执行阶段</span></div>
          <button class="btn primary" onclick="startBuild()">开始执行</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="inputbar">
          <div class="field">
            <input id="msgInput" placeholder="说一个想法开始(如:做个记账 App)…">
            <button class="send-btn" id="sendBtn" title="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
            </button>
          </div>
        </div>
        <div class="hint" id="hint">Enter 发送 · 进入项目后可翻看产生的 PRD / SPEC 文档</div>
      </section>
      <section class="view" id="view-prd"></section>
      <section class="view" id="view-spec"></section>
    </div>
  </div>

  <!-- 右面板 -->
  <aside class="panel">
    <section>
      <div class="sec-head"><span class="sec-title">活动 · 实时动态</span></div>
      <div class="feed" id="feed"></div>
    </section>
    <section>
      <div class="sec-head"><span class="sec-title">Token 消耗</span></div>
      <div class="tiles">
        <div class="tile"><div class="tile-label">本轮</div><div class="tile-value" id="turnTokens">0</div><div class="tile-sub" id="turnSplit">in 0 · out 0</div></div>
        <div class="tile"><div class="tile-label">总计</div><div class="tile-value" id="totalTokens">0</div><div class="tile-sub" id="totalSplit">in 0 · out 0</div></div>
      </div>
      <div class="chart-note">每轮 token(蓝 = 最新)</div>
      <div class="bars" id="chart"></div>
      <div class="legend"><span><i style="background:var(--blue)"></i>最新</span><span><i style="background:var(--blue-dim)"></i>历史</span></div>
    </section>
  </aside>
</div>

<!-- 遮罩 + 三个弹层 -->
<div class="overlay" id="overlay"></div>

<!-- 新建项目 -->
<div class="modal" id="newModal">
  <div class="modal-head"><b>新建项目</b></div>
  <div class="modal-body">
    <label class="f-label">项目名称</label>
    <input class="f-input" id="projName" placeholder="默认取目录名">
    <label class="f-label">项目目录</label>
    <div class="f-row">
      <input class="f-input" id="projDir" placeholder="选择或输入项目文件夹的绝对路径">
      <button class="btn" id="pickBtn">选择文件夹</button>
    </div>
    <div class="f-note">supervisor 与项目目录需在同一台机器;「选择文件夹」会弹出系统对话框。</div>
    <div class="f-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createProject()">创建</button></div>
  </div>
</div>

<!-- API 配置 -->
<div class="modal" id="apiModal">
  <div class="modal-head"><b>API 配置(全局)</b></div>
  <div class="modal-body">
    <label class="f-label">Provider</label>
    <select class="f-input" id="apiProvider">
      <option value="anthropic">anthropic</option>
      <option value="openai">openai</option>
    </select>
    <label class="f-label">API Key</label>
    <input class="f-input" id="apiKey" placeholder="留空 = 不修改已有 key" autocomplete="off">
    <label class="f-label">Base URL</label>
    <input class="f-input" id="apiUrl" placeholder="如 https://api.deepseek.com/anthropic">
    <label class="f-label">模型</label>
    <input class="f-input" id="apiModel" placeholder="模型名">
    <div class="f-row2">
      <div><label class="f-label">Max Tokens</label><input class="f-input" id="apiMax" type="number"></div>
      <div><label class="f-label">Context Window</label><input class="f-input" id="apiWindow" type="number"></div>
    </div>
    <div class="f-note" id="apiNote"></div>
    <div class="f-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveConfig()">保存</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
